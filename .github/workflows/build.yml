name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Export Expo Bundle
        run: npx expo export --platform ios

      - name: Create Native iOS App Bundle & IPA
        run: |
          mkdir -p Payload/apple-wallet.app
          cp -R dist/* Payload/apple-wallet.app/
          
          # Создаем минимальный Info.plist для iOS
          cat << 'EOF' > Payload/apple-wallet.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>apple-wallet</string>
              <key>CFBundleIdentifier</key>
              <string>com.anonymous.applewallet</string>
              <key>CFBundleName</key>
              <string>apple-wallet</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          </plist>
          EOF

          zip -r apple-wallet.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-wallet-ipa
          path: apple-wallet.ipa
