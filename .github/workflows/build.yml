name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI & EAS CLI
        run: npm install -g expo-cli eas-cli

      - name: Export Expo Bundle
        run: npx expo export --platform ios

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R .expo/Payload/ Payload/ 2>/dev/null || true
          zip -r apple-wallet.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-wallet-ipa
          path: apple-wallet.ipa
